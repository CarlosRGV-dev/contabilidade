<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Contas a Pagar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Controle de Contas a Pagar</h1>
            <p>Gerencie suas dívidas. Os dados serão apagados ao sair da página.</p>
        </header>

        <!-- Formulário de Cadastro -->
        <section class="form-section">
            <form id="debt-form">
                <div class="input-group">
                    <label for="debt-name">Nome da Loja / Dívida:</label>
                    <input type="text" id="debt-name" required placeholder="Ex: Magazine Luiza, Cartão...">
                </div>

                <div class="input-group">
                    <label for="debt-value">Valor da Parcela (R$):</label>
                    <input type="number" step="0.01" id="debt-value" required placeholder="0,00">
                </div>

                <div class="input-group">
                    <label for="debt-total-value">Valor Total (R$) (Opcional):</label>
                    <input type="number" step="0.01" id="debt-total-value" placeholder="0,00">
                </div>

                <div class="input-group">
                    <label for="debt-installment">Parcela (ex: 2/10 ou À vista):</label>
                    <input type="text" id="debt-installment" placeholder="Ex: 1/5 ou À vista">
                </div>

                <div class="input-group">
                    <label for="debt-date">Data de Vencimento / Pagamento:</label>
                    <input type="date" id="debt-date" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Adicionar Conta</button>
                </div>
            </form>
        </section>

        <!-- Tabela de Listagem -->
        <section class="table-section">
            <div class="table-header">
                <h2>Lista de Dívidas</h2>
                <div class="actions">
                    <button id="btn-pdf" class="btn btn-secondary">Gerar PDF / Imprimir</button>
                </div>
            </div>
            
            <div class="table-responsive">
                <table id="debt-table">
                    <thead>
                        <tr>
                            <th>Loja / Dívida</th>
                            <th>Valor Parcela</th>
                            <th>Valor Total</th>
                            <th>Parcela</th>
                            <th>Vencimento</th>
                            <th class="no-print">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="debt-tbody">
                        <!-- Preenchido dinamicamente via JavaScript -->
                    </tbody>
                </table>
            </div>

            <div class="total-summary" id="total-summary">
                <strong>Total Geral das Parcelas: R$ 0,00</strong>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
